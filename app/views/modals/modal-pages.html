<div class="modal-backdrop" ng-if="showMinPagesModal" ng-controller="ActionController" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050;">
    <div class="modal-dialog" style="margin: 100px auto; max-width: 350px;">
        <div class="modal-content" style="background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <h4 class="modal-title" style="margin-top: 0;">Мінімальна кількість сторінок</h4>
            
            <div class="form-group">
                <label for="minPagesInput">Кількість сторінок:</label>
                <input type="number" 
                       id="minPagesInput"
                       class="form-control" 
                       ng-model="minPages" 
                       placeholder="Введіть число" 
                       min="0" />
            </div>

            <div style="margin-top: 20px; text-align: right;">
                <button type="button" class="btn btn-default" ng-click="closeModal()">Скасувати</button>
                <button type="button" class="btn btn-primary" ng-click="submitBestseller()">Застосувати</button>
            </div>
        </div>
    </div>
</div>
