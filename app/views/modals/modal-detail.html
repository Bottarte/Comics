<div class="modal-backdrop" 
     ng-controller="ComicGeneralController"
     ng-if="state.modalState.active === 'detail'" 
     style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    
    <div class="modal-content" style="background: #fff; padding: 20px; border-radius: 8px; width: 420px; max-height: 90vh; overflow-y: auto;">
        <h3>{{ state.isEditingDetail ? 'Редагувати деталь' : 'Додати нову деталь' }}</h3>

        <form ng-submit="saveDetailMain()">
            <div class="form-group" style="margin-bottom: 10px;">
                <label>Магазин:</label>
                <select class="form-control" 
                        ng-model="state.detailFormData.shopId" 
                        ng-options="shop.id as shop.name for shop in state.shops" 
                        required>
                    <option value="" disabled selected>-- Оберіть магазин --</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label>Ціна:</label>
                <input type="number" step="0.01" class="form-control" ng-model="state.detailFormData.price" required />
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label>Кількість:</label>
                <input type="number" class="form-control" ng-model="state.detailFormData.quantity" required />
            </div>

            <div class="form-actions" style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
                <button type="submit" class="btn btn-primary" ng-disabled="isSaving">Зберегти</button>
                <button type="button" class="btn btn-secondary" ng-click="state.modalState.active = null">Скасувати</button>
            </div>
        </form>
    </div>
</div>
